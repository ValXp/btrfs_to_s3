[global]
log_level = "info" # debug|info|warning|error|critical
state_path = "/var/lib/btrfs_to_s3/state.json"
lock_path = "/var/lock/btrfs_to_s3.lock"
spool_dir = "/mnt/ssd/btrfs_to_s3_spool"
spool_size_bytes = 214748364800

[schedule]
full_every_days = 180
incremental_every_days = 7
run_at = "02:00"

[filesystem]
backend = "btrfs" # btrfs|zfs; omit [filesystem] only for legacy Btrfs configs

[snapshots]
# Btrfs: base_dir is required and is where local readonly snapshots are created.
# ZFS: omit base_dir and keep only retain.
base_dir = "/srv/snapshots"
retain = 2

[subvolumes]
# Btrfs only: source subvolume paths on the local host.
# CLI/source identifiers are the basenames of these paths: data, home.
paths = ["/srv/data", "/srv/home"]

# For ZFS, switch [filesystem].backend to "zfs", omit [subvolumes], and use:
#
# [snapshots]
# retain = 2
#
# [zfs]
# pool_name = "tank"
# mount_root = "/tank"
# source_datasets = ["tank/data", "tank/home"]
# receive_parent_dataset = "tank/restore"
# snapshot_prefix = "btrfs-to-s3"
#
# Use fully qualified dataset names so CLI --source values are obvious.

[s3]
bucket = "my-backup-bucket"
region = "us-east-1"
prefix = "btrfs/host-01"
chunk_size_bytes = 214748364800
storage_class_chunks = "DEEP_ARCHIVE"
storage_class_manifest = "STANDARD"
concurrency = 4
spool_enabled = false
sse = "AES256"

[restore]
target_base_dir = "/srv/restore"
# For ZFS, set target_base_dir to the mounted path of zfs.receive_parent_dataset,
# for example "/tank/restore".
verify_mode = "full" # full|sample|none
sample_max_files = 1000
wait_for_restore = true
restore_timeout_seconds = 259200
restore_tier = "Standard"
